<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premier Mobile — Demo Frame</title>
<style>
  /* The controls stay dark always; only the stage behind the phone is themed,
     so a light backdrop never turns the sidebar into glare on a screenshare. */
  :root {
    --bg: #14161a;
    --panel: #1e2126;
    --panel-border: #2e333b;
    --text: #e8ebef;
    --text-dim: #98a1ae;
    --accent: #4d8bff;
    --shell: #1c1c1e;
    --shell-edge: #4a4a50;
    --stage-bg: #14161a;
    --scale: 1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* Row, not column: controls live down one side so the full window height
       stays available to a portrait phone. Swap to row-reverse for a right-hand
       sidebar — that single word is the only change needed. */
    display: flex; flex-direction: row;
    overflow: hidden;
  }

  /* ---------- sidebar ---------- */
  #bar {
    flex: 0 0 206px;
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    padding: 14px 12px;
    background: var(--panel);
    border-right: 1px solid var(--panel-border);
    box-shadow: 1px 0 3px rgba(0,0,0,.06);
    overflow-y: auto;
    z-index: 20;
  }
  body.presenting #bar { display: none; }
  #bar label {
    color: var(--text-dim); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
    margin-top: 2px;
  }
  .row { display: flex; align-items: center; gap: 7px; }
  .row > .grow { flex: 1 1 auto; min-width: 0; }
  select, input[type=text], button {
    font: inherit; color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 7px; padding: 6px 9px;
  }
  input[type=text], select { width: 100%; min-width: 0; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  input[type=range] { width: 100%; min-width: 0; accent-color: var(--accent); }
  input[type=color] {
    width: 30px; height: 30px; padding: 2px;
    border: 1px solid var(--panel-border); border-radius: 7px;
    background: var(--panel); cursor: pointer;
  }
  .sep { width: 100%; height: 1px; background: var(--panel-border); margin: 4px 0; }
  .spacer { flex: 1 1 auto; min-height: 12px; }

  /* ---------- stage ---------- */
  #stage {
    flex: 1 1 auto; position: relative;
    display: flex;
    overflow: auto; padding: 24px;
    background: var(--stage-bg);
  }

  /* backdrop swatches */
  #swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #swatches button {
    aspect-ratio: 1; padding: 0; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }
  #swatches button:hover { border-color: var(--accent); }
  #swatches button[aria-pressed="true"] {
    outline: 2px solid var(--accent); outline-offset: 2px; border-color: transparent;
  }
  #swatches button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* #reserve holds the post-scale footprint so the stage can scroll to it;
     margin:auto centres without clipping the edges the way justify-content
     :center does once the device exceeds the stage. #scaler must stay at its
     natural size — sizing it would resize the device, then scale it again. */
  #reserve { margin: auto; flex: 0 0 auto; }
  #scaler {
    width: max-content; height: max-content;
    transform: scale(var(--scale)); transform-origin: top left;
  }

  /* ---------- device shell ---------- */
  #device {
    position: relative;
    background: linear-gradient(160deg, #4b4b52 0%, var(--shell) 22%, #131316 78%, #3c3c42 100%);
    padding: 11px;
    border-radius: var(--shell-radius, 56px);
    box-shadow:
      0 0 0 1.5px var(--shell-edge),
      0 30px 60px -18px rgba(0,0,0,.55),
      0 8px 20px -8px rgba(0,0,0,.35);
  }
  #screen {
    position: relative; overflow: hidden;
    border-radius: var(--screen-radius, 46px);
    background: #000;
    display: flex; flex-direction: column;
  }
  /* position:relative alone lifts this above the iframe so its 1px shadow can
     cover the hairline the black screen background bleeds through at
     fractional zoom. Do NOT add z-index — that promotes it to its own layer,
     and Chrome then drops #screen's rounded-corner clipping, squaring off the
     bar over the bezel. */
  #statusbar {
    flex: 0 0 auto; position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; font-size: 14px; font-weight: 600;
    letter-spacing: .2px; user-select: none;
  }
  #statusbar .icons { display: flex; align-items: center; gap: 5px; }
  #statusbar svg { display: block; }
  /* The app's html/body are transparent, so any area its own layout doesn't
     cover falls through to whatever sits behind. Black reads as screen;
     white would read as a rendering gap. */
  iframe {
    flex: 1 1 auto; width: 100%; border: 0; display: block;
    background: #000;
  }
  /* notch / island / punch-hole */
  #island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    background: #000; z-index: 5; pointer-events: none;
  }
  /* top is measured from the shell, so it includes the 11px bezel padding —
     23px puts the island 12px below the screen edge, as on a real handset. */
  #island.island { width: 107px; height: 31px; border-radius: 16px; top: 23px; }
  #island.punch  { width: 11px;  height: 11px; border-radius: 50%; top: 24px; }
  #island.none   { display: none; }
  /* physical side buttons */
  .btn-side { position: absolute; background: linear-gradient(90deg,#2a2a2e,#4a4a50); }
  .btn-power { right: -2.5px; top: 22%; width: 3px; height: 76px; border-radius: 0 2px 2px 0; }
  .btn-vol-u { left: -2.5px; top: 17%; width: 3px; height: 46px; border-radius: 2px 0 0 2px; }
  .btn-vol-d { left: -2.5px; top: 27%; width: 3px; height: 46px; border-radius: 2px 0 0 2px; }

  /* The iframe's initial document paints its own white canvas before the app
     commits, so black is held over the screen until the load event fires. */
  #veil {
    position: absolute; inset: 0; z-index: 3;
    background: #000; pointer-events: none;
    opacity: 1;                       /* appears instantly — no fade-in gap */
  }
  #veil.done { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { #veil { transition: none; } }

  /* ---------- fallback notice ---------- */
  #fallback {
    display: none;
    position: absolute; inset: 0; z-index: 8;
    background: var(--panel); color: var(--text);
    padding: 34px 26px; text-align: center;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  #fallback.show { display: flex; }
  #fallback h3 { margin: 0; font-size: 16px; }
  #fallback p { margin: 0; color: var(--text-dim); font-size: 13px; max-width: 260px; }

  /* Collapsed by default: the reference costs one line until someone wants it. */
  #shortcuts { flex: 0 0 auto; }
  #shortcuts summary {
    cursor: pointer; list-style: none;
    color: var(--text-dim); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
    padding: 6px 0 0; border-top: 1px solid var(--panel-border);
  }
  #shortcuts summary::-webkit-details-marker { display: none; }
  #shortcuts summary::before { content: '▸ '; }
  #shortcuts[open] summary::before { content: '▾ '; }
  #shortcuts summary:hover { color: var(--accent); }
  #hint { color: var(--text-dim); font-size: 10.5px; line-height: 1.7; padding-top: 6px; }

  /* Always-available way out of presenter mode — faint until you reach for it,
     so it stays invisible on a screenshare but is never a guessing game. */
  #exit-present {
    display: none;
    position: absolute; top: 10px; right: 12px; z-index: 30;
    padding: 5px 11px; border-radius: 20px;
    font-size: 12px; opacity: .18; transition: opacity .15s;
  }
  body.presenting #exit-present { display: block; }
  #exit-present:hover { opacity: 1; }
</style>
</head>
<body>

<div id="bar">
  <label for="device-select">Device</label>
  <select id="device-select"></select>
  <button id="rotate" title="Rotate (T)">⟳ Rotate</button>

  <div class="sep"></div>

  <label for="url">Address</label>
  <input type="text" id="url" spellcheck="false" placeholder="https://…">
  <div class="row">
    <button id="go" class="primary grow">Load</button>
    <button id="reload" title="Reload the app (R)">↻</button>
  </div>

  <div class="sep"></div>

  <label for="zoom">Size</label>
  <div class="row">
    <input type="range" id="zoom" min="50" max="180" step="5" class="grow">
    <span id="zoom-val" style="color:var(--text-dim);width:38px;text-align:right">100%</span>
  </div>
  <button id="fit" title="Size the phone to fit this window (0)">Fit to window</button>

  <div class="sep"></div>

  <label>Appearance</label>
  <div class="row">
    <input type="color" id="sb-color" title="Match the status bar to your app's header">
    <span class="grow" style="color:var(--text-dim);font-size:12px">Status bar colour</span>
  </div>
  <label>Backdrop</label>
  <div id="swatches"></div>
  <div class="row">
    <input type="color" id="bd-color" title="Any other backdrop colour">
    <span class="grow" style="color:var(--text-dim);font-size:12px">Custom colour</span>
  </div>

  <div class="spacer"></div>

  <button id="present" class="primary" title="Hide these controls (H)">Presenter mode</button>
  <button id="reset" title="Back to the shipped defaults">Reset</button>
  <details id="shortcuts">
    <summary>Shortcuts</summary>
    <div id="hint">H — presenter mode · Esc — exit · R — reload · T — rotate · +/− — size · 0 — fit</div>
  </details>
</div>

<div id="stage">
  <div id="reserve"><div id="scaler">
    <div id="device">
      <span class="btn-side btn-power"></span>
      <span class="btn-side btn-vol-u"></span>
      <span class="btn-side btn-vol-d"></span>
      <div id="screen">
        <div id="statusbar">
          <span id="clock">9:41</span>
          <span class="icons">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7.5" width="3" height="3.5" rx=".7"/><rect x="4.4" y="5.5" width="3" height="5.5" rx=".7"/><rect x="8.8" y="3" width="3" height="8" rx=".7"/><rect x="13.2" y="0" width="3" height="11" rx=".7"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.2 5.9 8.9a3 3 0 0 1 4.2 0L8 11.2Zm-4-4.3-1.5-1.7a8.4 8.4 0 0 1 11 0L12 6.9a6.3 6.3 0 0 0-8 0ZM1 3.8-.4 2.2a12.6 12.6 0 0 1 16.8 0L15 3.8a10.5 10.5 0 0 0-14 0Z"/></svg>
            <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".6" y=".6" width="21" height="10.8" rx="3" stroke="currentColor" stroke-opacity=".4" stroke-width="1.1"/><rect x="2.2" y="2.2" width="17.5" height="7.6" rx="1.9" fill="currentColor"/><path d="M23.4 4.1v3.8a2 2 0 0 0 0-3.8Z" fill="currentColor" fill-opacity=".45"/></svg>
          </span>
        </div>
        <iframe id="app" allow="geolocation; camera; microphone; clipboard-write; fullscreen; autoplay"></iframe>
        <div id="veil"></div>
        <div id="fallback">
          <h3>The app didn't load in the frame</h3>
          <p>It may be blocking embedding, or your session cookie didn't carry over. Open it in a phone-sized window instead.</p>
          <button id="popout" class="primary">Open in phone-sized window</button>
        </div>
      </div>
      <div id="island"></div>
    </div>
  </div></div>
  <button id="exit-present">Exit presenter mode — H or Esc</button>
</div>

<script>
const DEVICES = [
  { id:'ip15p',  name:'iPhone 15 Pro',      w:393, h:852,  sr:56, cr:46, notch:'island', sb:54 },
  { id:'ip15pm', name:'iPhone 15 Pro Max',  w:430, h:932,  sr:58, cr:48, notch:'island', sb:54 },
  { id:'ipse',   name:'iPhone SE',          w:375, h:667,  sr:34, cr:6,  notch:'none',   sb:22 },
  { id:'px8',    name:'Pixel 8',            w:412, h:915,  sr:42, cr:32, notch:'punch',  sb:34 },
  { id:'s24',    name:'Galaxy S24',         w:360, h:780,  sr:40, cr:30, notch:'punch',  sb:34 },
  { id:'ipadm',  name:'iPad mini',          w:744, h:1133, sr:34, cr:22, notch:'none',   sb:26 },
];
const DEFAULT_URL = 'https://mobile.premierconstructionsoftware.com/';
const BACKDROPS = [
  { name: 'Charcoal',      hex: '#14161a' },
  { name: 'Black',         hex: '#000000' },
  { name: 'Slate',         hex: '#2b303a' },
  { name: 'Premier navy',  hex: '#0f2744' },
  { name: 'Light grey',    hex: '#eceff3' },
  { name: 'White',         hex: '#ffffff' },
  { name: 'Warm sand',     hex: '#d9d2c5' },
  { name: 'Chroma green',  hex: '#00b140' },   // for keying the phone out in OBS
];

const $ = id => document.getElementById(id);
const el = {
  select:$('device-select'), url:$('url'), go:$('go'), reload:$('reload'),
  zoom:$('zoom'), zoomVal:$('zoom-val'), rotate:$('rotate'), sbColor:$('sb-color'),
  present:$('present'), device:$('device'), screen:$('screen'),
  statusbar:$('statusbar'), app:$('app'), island:$('island'),
  fallback:$('fallback'), popout:$('popout'), clock:$('clock'), scaler:$('scaler'),
  exitPresent:$('exit-present'), reserve:$('reserve'),
  swatches:$('swatches'), bdColor:$('bd-color'), veil:$('veil'),
};

const store = {
  get(k, d) { try { const v = localStorage.getItem('pcsframe.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pcsframe.' + k, JSON.stringify(v)); } catch (e) {} },
};

let state = {
  device:   store.get('device', 'ip15pm'),   // Pro Max — biggest screen for demos
  landscape:store.get('landscape', false),
  zoom:     store.get('zoom', 100),   // first run overrides this with a fit-to-window
  sbColor:  store.get('sbColor', '#ffffff'),
  // Guarded: earlier versions stored names like "dark" here, which would feed
  // an invalid colour into CSS and blank the stage.
  backdrop:   (v => /^#[0-9a-f]{6}$/i.test(v) ? v : '#14161a')(store.get('backdrop', '')),
  url:      store.get('url', DEFAULT_URL),
};

DEVICES.forEach(d => {
  const o = document.createElement('option');
  o.value = d.id; o.textContent = d.name;
  el.select.appendChild(o);
});

BACKDROPS.forEach(b => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.dataset.hex = b.hex;
  btn.style.background = b.hex;
  btn.title = b.name;
  btn.setAttribute('aria-label', b.name);
  btn.addEventListener('click', () => { state.backdrop = b.hex; render(); });
  el.swatches.appendChild(btn);
});

function currentDevice() {
  return DEVICES.find(d => d.id === state.device) || DEVICES[0];
}

// Black or white status-bar text, whichever reads better on the chosen colour.
function contrastOn(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => {
    const s = c / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.45 ? '#000' : '#fff';
}

function render() {
  const d = currentDevice();
  const w = state.landscape ? d.h : d.w;
  const h = state.landscape ? d.w : d.h;

  el.screen.style.width  = w + 'px';
  el.screen.style.height = h + 'px';
  el.device.style.setProperty('--shell-radius',  d.sr + 'px');
  el.device.style.setProperty('--screen-radius', d.cr + 'px');

  el.statusbar.style.height = d.sb + 'px';
  // Line the time up with the island's centre rather than sitting below it.
  el.statusbar.style.paddingTop = (d.notch === 'island' ? 4 : 0) + 'px';
  el.statusbar.style.background = state.sbColor;
  el.statusbar.style.color = contrastOn(state.sbColor);
  el.statusbar.style.boxShadow = '0 1px 0 ' + state.sbColor;

  document.documentElement.style.setProperty('--stage-bg', state.backdrop);
  el.bdColor.value = state.backdrop;
  [...el.swatches.children].forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.hex.toLowerCase() === state.backdrop.toLowerCase()));

  el.island.className = d.notch;

  document.documentElement.style.setProperty('--scale', state.zoom / 100);
  el.zoom.value = state.zoom;
  el.zoomVal.textContent = state.zoom + '%';
  el.select.value = d.id;
  el.sbColor.value = state.sbColor;

  // Reserve the post-scale footprint so the stage can scroll to the full device.
  el.reserve.style.width  = (w + 22) * (state.zoom / 100) + 'px';
  el.reserve.style.height = (h + 22) * (state.zoom / 100) + 'px';

  ['device','landscape','zoom','sbColor','backdrop'].forEach(k => store.set(k, state[k]));
}

let loadTimer = null;
let veilTimer = null;
function load(url) {
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  state.url = url;
  el.url.value = url;
  store.set('url', url);

  el.fallback.classList.remove('show');
  el.veil.classList.remove('done');
  clearTimeout(loadTimer);
  clearTimeout(veilTimer);
  // We can't read a cross-origin frame, so fall back on a timeout instead.
  loadTimer = setTimeout(() => el.fallback.classList.add('show'), 9000);
  el.app.src = url;
}
// The veil covers the iframe's blank white canvas before the app commits, then
// lifts the instant the frame loads — no hold, no fade. If the app ever posts
// APP_READY it lifts on that signal instead, which can only be earlier.
const APP_READY = 'premier-app-ready';

function dropVeil() {
  clearTimeout(veilTimer);
  el.veil.classList.add('done');
}

// Only trust a ready signal from the origin we actually loaded.
window.addEventListener('message', e => {
  let expected = null;
  try { expected = new URL(state.url).origin; } catch (err) { return; }
  if (e.origin !== expected) return;
  const kind = typeof e.data === 'string' ? e.data : (e.data && e.data.type);
  if (kind === APP_READY) dropVeil();
});

el.app.addEventListener('load', () => {
  clearTimeout(loadTimer);
  dropVeil();
});
// If the frame is blocked and never loads, drop the veil so the fallback shows.
setTimeout(dropVeil, 9000);

function popOut() {
  const d = currentDevice();
  const w = state.landscape ? d.h : d.w;
  const h = state.landscape ? d.w : d.h;
  window.open(state.url, 'pcsdemo',
    `width=${w},height=${h + 90},menubar=no,toolbar=no,location=no,status=no,resizable=yes`);
}

function tickClock() {
  const now = new Date();
  let hr = now.getHours();
  const ampm = hr >= 12;
  hr = hr % 12 || 12;
  el.clock.textContent = hr + ':' + String(now.getMinutes()).padStart(2, '0');
  el.clock.title = ampm ? 'PM' : 'AM';
}

// Switching devices re-fits, so a bigger handset never lands off-screen.
el.select.addEventListener('change', () => { state.device = el.select.value; fitToWindow(); });
el.zoom.addEventListener('input', () => { state.zoom = +el.zoom.value; render(); });
el.sbColor.addEventListener('input', () => { state.sbColor = el.sbColor.value; render(); });
el.rotate.addEventListener('click', () => { state.landscape = !state.landscape; render(); });
el.go.addEventListener('click', () => load(el.url.value.trim()));
el.url.addEventListener('keydown', e => { if (e.key === 'Enter') load(el.url.value.trim()); });
el.reload.addEventListener('click', () => load(state.url));
el.popout.addEventListener('click', popOut);
// Largest zoom that keeps the whole device inside the stage, snapped to the
// slider's 5% steps and clamped to its range.
function fitToWindow() {
  const d = currentDevice();
  const w = (state.landscape ? d.h : d.w) + 22;
  const h = (state.landscape ? d.w : d.h) + 22;
  const stage = $('stage').getBoundingClientRect();
  const pct = Math.min((stage.width - 56) / w, (stage.height - 56) / h) * 100;
  state.zoom = Math.max(50, Math.min(180, Math.floor(pct / 5) * 5));
  render();
}
$('fit').addEventListener('click', fitToWindow);

// Settings live in this browser's localStorage, not in the file, so a rep who
// fiddles their copy into a corner needs a way back.
$('reset').addEventListener('click', () => {
  // Sweep every key we own, so settings left by older versions go too.
  try {
    Object.keys(localStorage)
      .filter(k => k.startsWith('pcsframe.'))
      .forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  location.reload();
});

function setPresenting(on) {
  document.body.classList.toggle('presenting', on);
}
el.present.addEventListener('click', () => setPresenting(true));
el.exitPresent.addEventListener('click', () => setPresenting(false));
el.bdColor.addEventListener('input', () => { state.backdrop = el.bdColor.value; render(); });

document.addEventListener('keydown', e => {
  // Esc always gets you out, even mid-typing.
  if (e.key === 'Escape') { setPresenting(false); return; }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === 'h') setPresenting(!document.body.classList.contains('presenting'));
  else if (k === 'r') load(state.url);
  else if (k === 't') { state.landscape = !state.landscape; render(); }
  else if (k === 'f') document.documentElement.requestFullscreen?.();
  else if (e.key === '+' || e.key === '=') { state.zoom = Math.min(180, state.zoom + 5); render(); }
  else if (e.key === '-') { state.zoom = Math.max(50, state.zoom - 5); render(); }
  else if (e.key === '0') fitToWindow();
});

const firstRun = store.get('zoom', null) === null;

render();
// On a machine that has never opened this file, size the phone to the window
// rather than dumping a 100% device that overflows a laptop screen.
if (firstRun) fitToWindow();
tickClock();
setInterval(tickClock, 15000);
load(state.url);
</script>
</body>
</html>
